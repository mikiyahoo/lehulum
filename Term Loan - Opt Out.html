<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Term Loan · Opt-Out</title>
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap');
  /* Opt-Out (Term Loan ⋮ menu): the loan products the customer is opted in to, each with
     Opt-Out, and Opt-Out from All. Nothing owed → confirm sheet → M-PESA PIN → back here with
     a "Successfully Opted out" toast. Still owing → "Repay to Opt-Out" sheet → Repay Now
     (Loan Details for one product, Repay Loan for all). Opted-out ids: sessionStorage 'tlOptOut'. */
  :root { --Font: Switzer, sans-serif; --Primary: #FE353D; --Primary-Light: #FFF1F2; --On-Surface: #1C1C21; --On-Surface-Low: #7C7C87; --Background: #F5F5F5; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--Font); background: transparent; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  button { font-family: inherit; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  .status-bar { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 8px; }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }
  .header-nav { flex-shrink: 0; display: flex; align-items: center; padding: 8px 16px 12px; }
  .icon-btn { width: 36px; height: 36px; border: none; background: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .icon-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .header-title { flex: 1; text-align: center; font-size: 17px; font-weight: 500; color: var(--On-Surface); margin-right: 36px; }
  .content { flex: 1; overflow-y: auto; padding: 4px 16px 20px; }
  .content::-webkit-scrollbar { width: 0; }
  .sec { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 2px 10px; }
  .sec b { font-size: 15px; font-weight: 600; color: var(--On-Surface); }
  .sec small { font-size: 12px; color: var(--On-Surface-Low); }
  .card { background: #FFF; border-radius: 18px; padding: 4px 14px; box-shadow: 0 4px 14px rgba(15,23,42,0.05); }
  .row { display: flex; align-items: center; gap: 12px; padding: 14px 0; }
  .row + .row { border-top: 1px solid #F1F1F4; }
  .lg { width: 38px; height: 38px; border-radius: 12px; border: 1px solid #EFEFF2; background: #FFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .lg img { width: 26px; height: 26px; object-fit: contain; }
  .info { flex: 1; min-width: 0; }
  .info b { display: block; font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .info small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--On-Surface-Low); }
  .pill { height: 30px; padding: 0 14px; border: none; border-radius: 999px; background: var(--Primary); color: #FFF; font-family: var(--Font); font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
  .all { margin-top: 12px; width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; border: none; border-radius: 18px; background: #FFF; box-shadow: 0 4px 14px rgba(15,23,42,0.05); cursor: pointer; text-align: left; font-family: var(--Font); }
  .all .ic { width: 38px; height: 38px; border-radius: 12px; background: var(--Primary-Light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ic svg, .big-ic svg { stroke: var(--Primary); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .all .ic svg { width: 19px; height: 19px; }
  .all .chev { width: 17px; height: 17px; stroke: var(--Primary); stroke-width: 2.2; fill: none; }
  .empty { padding: 26px 10px; text-align: center; font-size: 13px; color: var(--On-Surface-Low); }

  /* Sheets */
  .scrim { position: absolute; inset: 0; z-index: 100; background: rgba(15,15,20,0.5); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 101; background: #FFF; border-radius: 28px 28px 0 0; padding: 10px 18px 22px; text-align: center; transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .sheet.show { transform: none; }
  .grip { width: 40px; height: 4px; border-radius: 2px; background: #D8D8DE; margin: 0 auto 18px; }
  .big-ic { width: 54px; height: 54px; border-radius: 16px; background: var(--Primary-Light); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
  .big-ic svg { width: 24px; height: 24px; }
  .sheet h3 { font-size: 17px; font-weight: 700; color: var(--On-Surface); line-height: 1.3; padding: 0 10px; }
  .sheet p { margin: 8px 20px 0; font-size: 13px; line-height: 1.5; color: #55555E; }
  .owe { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding: 14px; border-radius: 12px; background: #FFF6F6; font-size: 12.5px; color: #55555E; text-align: left; }
  .owe b { font-size: 13px; font-weight: 700; color: var(--On-Surface); }
  .owe b small { font-size: 10.5px; font-weight: 500; color: var(--On-Surface-Low); }
  .btn-primary { width: 100%; height: 50px; margin-top: 20px; border: none; border-radius: 14px; background: var(--Primary); color: #FFF; font-family: var(--Font); font-size: 15px; font-weight: 500; cursor: pointer; box-shadow: 0 4px 16px rgba(254,53,61,0.28); }
  .btn-text { width: 100%; height: 44px; margin-top: 6px; border: none; background: none; font-family: var(--Font); font-size: 14px; font-weight: 500; color: var(--On-Surface); cursor: pointer; }

  /* Done toast */
  .toast { position: absolute; left: 16px; right: 16px; bottom: 30px; z-index: 120; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #1C1C21; color: #FFF; opacity: 0; transform: translateY(16px); transition: all .3s; pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }
  .toast i { width: 30px; height: 30px; border-radius: 8px; background: #22C55E; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .toast i svg { width: 16px; height: 16px; stroke: #FFF; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .toast b { display: block; font-size: 14px; font-weight: 500; }
  .toast small { display: block; margin-top: 2px; font-size: 11px; color: #A0A0AA; }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span class="time">10:00</span>
    <div class="status-icons">
      <svg viewBox="0 0 24 24" fill="#1C1C21"><path d="M2 22h20V2z"/></svg>
      <svg viewBox="0 0 24 24" fill="#1C1C21"><path d="M12 21 1 8a16 16 0 0 1 22 0z"/></svg>
      <svg viewBox="0 0 24 24" fill="#1C1C21"><rect x="7" y="3" width="10" height="18" rx="2"/></svg>
    </div>
  </div>
  <div class="header-nav">
    <button class="icon-btn" onclick="location.href='Term Loan.html'" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <span class="header-title">Opt-Out</span>
  </div>

  <div class="content">
    <div class="sec"><b>Credit Accounts</b><small id="count"></small></div>
    <div class="card" id="list"></div>
    <button class="all" id="allBtn" type="button" onclick="ask('all')">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></span>
      <span class="info"><b>Opt-Out from All</b><small>Clear the entire installment</small></span>
      <svg class="chev" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <div class="scrim" id="scrim" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet" role="dialog"></div>

  <div class="toast" id="toast"><i><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></i><span><b>Successfully Opted out</b><small id="toastSub"></small></span></div>
</div>

<script src="term-loan-store.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const fmt = TL.fmt;
  const POWER = '<svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>';
  const getOut = () => { try { return JSON.parse(sessionStorage.getItem('tlOptOut') || '[]'); } catch (e) { return []; } };
  const setOut = v => sessionStorage.setItem('tlOptOut', JSON.stringify(v));
  const loans = TL.active(TL.load());
  // What is still owed on a product (all its active loans)
  const owedOn = id => loans.filter(l => l.offer === id).reduce((a, l) => a + TL.remainingOf(l), 0);
  const firstLoan = id => loans.find(l => l.offer === id);

  // Back from the PIN: book the opt-out and say so
  (function () {
    const done = new URLSearchParams(location.search).get('done');
    if (!done) return;
    const out = getOut();
    const ids = done === 'all' ? TL.OFFERS.map(o => o.id) : [done];
    ids.forEach(id => { if (!out.includes(id)) out.push(id); });
    setOut(out);
    history.replaceState(null, '', location.pathname);
    const o = TL.offer(done);
    $('toastSub').textContent = (o ? o.name : 'All Term Loans') + ' No longer Active';
    setTimeout(() => { $('toast').classList.add('show'); setTimeout(() => $('toast').classList.remove('show'), 3200); }, 250);
  })();

  function render() {
    const out = getOut(), list = TL.OFFERS.filter(o => !out.includes(o.id));
    $('count').textContent = list.length + ' active';
    $('list').innerHTML = list.length ? list.map(o => `<div class="row">
        <span class="lg"><img src="${o.logo}" alt=""></span>
        <span class="info"><b>${o.name}</b><small>${o.lender}</small></span>
        <button class="pill" type="button" onclick="ask('${o.id}')">Opt-Out</button></div>`).join('')
      : '<p class="empty">You are not opted in to any loan.</p>';
    $('allBtn').style.display = list.length ? '' : 'none';
  }
  render();

  // Opt-Out tapped: owing → repay first; nothing owed → confirm
  function ask(id) {
    const all = id === 'all', o = TL.offer(id);
    const owed = all ? TL.outstanding(TL.load()) : owedOn(id);
    const name = all ? 'All Term Loans' : o.name;
    $('sheet').innerHTML = owed > 0.004
      ? `<div class="grip"></div><div class="big-ic">${POWER}</div>
         <h3>Repay to Opt-Out from ${name}</h3>
         <p>Pay the remaining balance now and you can opt out.</p>
         <div class="owe"><span>Remaining to repay</span><b>${fmt(owed)} <small>ETB</small></b></div>
         <button class="btn-primary" type="button" onclick="repayNow('${id}')">Repay Now</button>
         <button class="btn-text" type="button" onclick="closeSheet()">Not Now</button>`
      : `<div class="grip"></div><div class="big-ic">${POWER}</div>
         <h3>Opt-Out from ${name}?</h3>
         <p>You can opt in again any time.</p>
         <button class="btn-primary" type="button" onclick="toPin('${id}')">Opt-Out</button>
         <button class="btn-text" type="button" onclick="closeSheet()">Not Now</button>`;
    $('scrim').classList.add('show'); $('sheet').classList.add('show');
  }
  function closeSheet() { $('scrim').classList.remove('show'); $('sheet').classList.remove('show'); }
  function repayNow(id) {
    const l = id === 'all' ? null : firstLoan(id);
    location.href = l ? 'Term Loan - Details.html?id=' + l.id : 'Term Loan - Repay Loan.html';
  }
  // Confirm with the M-PESA PIN, then come back here
  function toPin(id) {
    const o = TL.offer(id);
    sessionStorage.setItem('termLoanData', JSON.stringify({
      kind: 'tl-optout', title: o ? o.name : 'All Term Loans', logo: o ? o.logo : undefined, initials: o ? undefined : 'TL',
      sub: '<b>Opt-Out:</b> ' + (o ? o.lender : 'every loan product'), btn: 'Opt-Out',
      back: 'Term Loan - Opt Out.html', next: 'Term Loan - Opt Out.html?done=' + id
    }));
    location.href = 'Term Loan - Enter PIN.html';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
</script>
<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
