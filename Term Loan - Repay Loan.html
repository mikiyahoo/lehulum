<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repay Loan</title>
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap');

  /* Repay Loan (Credit & Saving / Term Loan → Repay Loan): one card per active
     credit account — what is still owed, how much is repaid, the next due date —
     Repay → Repayment screen, the card → Loan Details. Recent loan transactions below. */
  :root {
    --Primary: #FE353D;
    --Primary-Light: #FFF1F2;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Background: #F5F5F5;
    --Up: #16A34A;
    --Blue: #2F6FED;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Switzer, sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  button { font-family: inherit; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  .app-content { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 8px; background: var(--Background); flex-shrink: 0; }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }
  .header-nav { display: flex; align-items: center; padding: 8px 16px 12px; flex-shrink: 0; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: rgba(0,0,0,0.05); }
  .icon-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .header-title { flex: 1; margin-right: 36px; text-align: center; color: var(--On-Surface); font-size: 17px; font-weight: 500; letter-spacing: 0.3px; }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { width: 0; }
  .scroll > * { flex-shrink: 0; }

  .sec-head { display: flex; justify-content: space-between; align-items: center; margin: 4px 2px -2px; }
  .sec-head .title { font-size: 15px; font-weight: 400; color: var(--On-Surface); }
  .sec-head .note { font-size: 12.5px; color: var(--On-Surface-Low); }
  .sec-head a { display: inline-flex; align-items: center; gap: 2px; font-size: 12.5px; font-weight: 600; color: var(--Primary); cursor: pointer; text-decoration: none; }
  .sec-head a svg { width: 14px; height: 14px; fill: var(--Primary); }

  .card { background: #FFF; border-radius: 20px; padding: 16px; box-shadow: 0 4px 16px rgba(15,23,42,0.06); }

  /* Credit account card */
  .acct { cursor: pointer; }
  .acct-head { display: flex; align-items: center; gap: 12px; }
  .logo { width: 42px; height: 42px; border-radius: 50%; border: 1px solid #EFEFF2; background: #FFF; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .logo img { width: 30px; height: 30px; object-fit: contain; }
  .acct-head .info { flex: 1; min-width: 0; }
  .acct-head b { display: block; font-size: 15px; font-weight: 700; color: var(--On-Surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acct-head small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--On-Surface-Low); }
  .pill { flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.ok { background: #E8F9EE; color: #167C2A; }
  .pill.late { background: var(--Primary-Light); color: var(--Primary); }

  .figs { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-top: 16px; }
  .figs b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -0.3px; color: var(--On-Surface); white-space: nowrap; }
  .figs b span { font-size: 13px; font-weight: 600; margin-left: 2px; }
  .figs .r { text-align: right; }
  .figs .r b { font-size: 13px; font-weight: 600; letter-spacing: 0; }
  .figs small { display: block; margin-top: 3px; font-size: 11.5px; color: var(--On-Surface-Low); }
  .bar { margin-top: 12px; height: 8px; border-radius: 4px; background: #EEF0F4; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: var(--Blue); }

  .acct-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #F1F1F4; }
  .due { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: #55555E; }
  .due svg { width: 16px; height: 16px; stroke: var(--On-Surface-Low); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .due.late { color: var(--Primary); }
  .btn-repay { height: 34px; padding: 0 22px; border: none; border-radius: 999px; background: var(--Primary); color: #FFF; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 3px 10px rgba(254,53,61,0.25); }

  .empty { padding: 22px 16px; text-align: center; font-size: 13px; color: var(--On-Surface-Low); }

  /* Transactions */
  .txs { padding: 4px 14px; }
  .tx { display: flex; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer; }
  .tx + .tx { border-top: 1px solid #F4F4F6; }
  .tx .ic { width: 40px; height: 40px; border-radius: 12px; background: #FFE4E5; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tx .ic svg { width: 18px; height: 18px; stroke: var(--Primary); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .tx.in .ic { background: #E3F7EA; }
  .tx.in .ic svg { stroke: var(--Up); }
  .tx .info { flex: 1; min-width: 0; }
  .tx .info b { display: block; font-size: 13.5px; font-weight: 500; color: var(--On-Surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .info small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--On-Surface-Low); }
  .tx .right { text-align: right; flex-shrink: 0; }
  .tx .right b { display: block; font-size: 13.5px; font-weight: 700; color: var(--Primary); white-space: nowrap; }
  .tx.in .right b { color: var(--Up); }
  .tx .right small { display: block; margin-top: 2px; font-size: 11px; color: var(--On-Surface-Low); }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span class="time">10:00</span>
    <div class="status-icons">
      <svg data-name="icon-wifi" viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
      <svg data-name="icon-signal" viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
      <svg data-name="icon-battery" viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
    </div>
  </div>

  <div class="app-content">
    <div class="header-nav">
      <button class="icon-btn" onclick="history.length > 1 ? history.back() : location.href='Credit & Saving.html'" aria-label="Back"><svg data-name="icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <span class="header-title">Repay Loan</span>
    </div>

    <div class="scroll">
      <div class="sec-head"><span class="title">Credit Accounts</span><span class="note" id="count"></span></div>
      <div id="accts" style="display:flex;flex-direction:column;gap:12px"></div>

      <div class="sec-head"><span class="title">Transactions</span>
        <a href="Loan Transactions.html?type=loan"><svg viewBox="0 0 24 24"><path d="M9 6l7 6-7 6z"/></svg>See all</a></div>
      <div class="card txs" id="txs"></div>
    </div>
  </div>
</div>

<script src="term-loan-store.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const { fmt } = TL;
  const CAL = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
  const OUT = '<svg viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg>';
  const IN = '<svg viewBox="0 0 24 24"><path d="M17 7 7 17M16 17H7V8"/></svg>';

  // Active loans, soonest instalment first
  const loans = TL.active(TL.load()).sort((a, b) => new Date(TL.nextDue(a).due) - new Date(TL.nextDue(b).due));
  $('count').textContent = loans.length + ' active';
  $('accts').innerHTML = loans.length ? loans.map(l => {
    const owed = TL.remainingOf(l), pct = Math.round(TL.paidOf(l) / l.total * 100), nx = TL.nextDue(l);
    const late = new Date(nx.due) < Date.now();
    return `<div class="card acct" onclick="location.href='Term Loan - Details.html?id=${l.id}'">
      <div class="acct-head"><span class="logo"><img src="${l.logo}" alt=""></span>
        <span class="info"><b>${l.product}</b><small>${l.lender}</small></span>
        <span class="pill ${late ? 'late' : 'ok'}">${late ? 'Overdue' : 'Active'}</span></div>
      <div class="figs">
        <div><b>${fmt(owed)}<span> ETB</span></b><small>Credit Outstanding</small></div>
        <div class="r"><b>${pct}% of ${fmt(l.total)}</b><small>Total Outstanding</small></div>
      </div>
      <div class="bar"><i style="width:${Math.max(pct, 2)}%"></i></div>
      <div class="acct-foot"><span class="due${late ? ' late' : ''}">${CAL}Due: ${TL.dateStr(nx.due)}</span>
        <button class="btn-repay" type="button" onclick="event.stopPropagation(); location.href='Term Loan - Repay.html?id=${l.id}'">Repay</button></div>
    </div>`; }).join('') : '<div class="card empty">No active loans to repay.</div>';

  // Recent term-loan movements (no Errif)
  const day = d => { const t = new Date(); t.setHours(0, 0, 0, 0); const x = new Date(d); x.setHours(0, 0, 0, 0);
    const n = Math.round((t - x) / 864e5); return n === 0 ? 'Today' : n === 1 ? 'Yesterday' : x.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
  const TX = TL.transactions().filter(t => !t.errif).slice(0, 4);
  $('txs').innerHTML = TX.length ? TX.map(t => `
    <div class="tx${t.amt > 0 ? ' in' : ''}" onclick="location.href='${t.link}'">
      <span class="ic">${t.amt > 0 ? IN : OUT}</span>
      <span class="info"><b>${t.name}</b><small>${t.sub.replace(/^Term Loan · /, '')}</small></span>
      <span class="right"><b>${t.amt > 0 ? '+' : '-'}${fmt(Math.abs(t.amt))}</b><small>${day(t.when)}</small></span>
    </div>`).join('') : '<p class="empty">No transactions yet.</p>';
</script>
<script src="components/keyboard.js"></script>
<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
